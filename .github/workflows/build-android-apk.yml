name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.json'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install JavaScript dependencies
        run: npm install
      - name: Build hosted web app assets
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor project
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-draft-arena-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Chess & Draft Arena — Android APK
          target_commitish: main
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            Android APK for Chess & Draft Arena.

            This initial package loads the live hosted game from https://chess-draft-arena.onrender.com. Ordinary web-game and UI updates deploy centrally and appear when users refresh the app. An internet connection is required.
          files: android/app/build/outputs/apk/debug/app-debug.apk
